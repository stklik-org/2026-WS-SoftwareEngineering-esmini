# One-command start: `docker compose up` (or `make up`), then open http://localhost:8080/docs
services:
  esmini:
    image: ${ESMINI_IMAGE:-esmini-rest:dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        IMAGE_VERSION: ${IMAGE_VERSION:-dev}
    # The image is linux/amd64 only; on Apple silicon Docker runs it under emulation (PLAN.md §3.3, D10).
    platform: linux/amd64
    ports:
      # Loopback only: the service is not reachable from other machines (PLAN.md FR-14).
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-16}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
