# hadolint configuration (`docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml" hadolint/hadolint < docker/Dockerfile`)
ignored:
  # Base images are passed as build arguments that are pinned by digest (UBUNTU_IMAGE, UV_IMAGE); hadolint cannot
  # resolve ARG values.
  - DL3006
  # apt packages are not version-pinned: Ubuntu removes superseded versions from its archive, so pins break with
  # every security update. Reproducibility comes from the pinned base-image digest (PLAN.md §10.4).
  - DL3008
